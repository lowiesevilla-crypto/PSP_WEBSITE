name: PSP r8 Public Asset Diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose r8 public assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: https://psp.hoahub.tech
      EXPECTED_RELEASE: 2026-09-04-r8
      EXPECTED_DEPLOYMENT_GENERATION: 2026-09-04-pwa-email-branding-v1
    steps:
      - name: Verify exact r8 then diagnose each public assertion
        shell: bash
        run: |
          set -Eeuo pipefail

          health_status="$(curl --silent --show-error --max-time 10 --output /tmp/health.json --write-out '%{http_code}' "$PROD_URL/api/health" || true)"
          echo "health -> HTTP $health_status"
          cat /tmp/health.json || true
          test "$health_status" = "200"
          grep -q "\"release\":\"$EXPECTED_RELEASE\"" /tmp/health.json
          grep -q "\"deploymentGeneration\":\"$EXPECTED_DEPLOYMENT_GENERATION\"" /tmp/health.json

          fetch() {
            label="$1"
            url="$2"
            output="$3"
            follow="${4:-no}"
            if [ "$follow" = "yes" ]; then
              status="$(curl --silent --show-error --location --max-time 15 --output "$output" --write-out '%{http_code}' "$url" || true)"
            else
              status="$(curl --silent --show-error --max-time 15 --output "$output" --write-out '%{http_code}' "$url" || true)"
            fi
            bytes="$(wc -c < "$output" 2>/dev/null || echo 0)"
            echo "$label -> HTTP ${status:-000}, bytes=$bytes"
            if [ "$status" != "200" ]; then
              echo "FAILED_FETCH=$label" >&2
              head -c 1200 "$output" 2>/dev/null || true
              echo >&2
              exit 1
            fi
          }

          assert_contains() {
            label="$1"
            pattern="$2"
            file="$3"
            if grep -q "$pattern" "$file"; then
              echo "$label -> PASS [$pattern]"
            else
              echo "FAILED_ASSERTION=$label pattern=$pattern" >&2
              echo "--- response excerpt ---" >&2
              head -c 2400 "$file" >&2 || true
              echo >&2
              exit 1
            fi
          }

          fetch home "$PROD_URL/" /tmp/home.html yes
          fetch manifest "$PROD_URL/manifest.webmanifest" /tmp/manifest.json
          fetch privacy "$PROD_URL/privacy" /tmp/privacy.html
          fetch register "$PROD_URL/register" /tmp/register.html
          fetch install "$PROD_URL/install" /tmp/install.html
          fetch login "$PROD_URL/login" /tmp/login.html
          fetch chapter-logo-fallback "$PROD_URL/api/public/chapters/prod-smoke-invalid/logo" /tmp/chapter-logo yes

          echo "--- manifest ---"
          cat /tmp/manifest.json
          echo

          assert_contains home 'Psi Sigma Phi' /tmp/home.html
          assert_contains manifest-start-url '"start_url"' /tmp/manifest.json
          assert_contains manifest-stable-id '"id":"/"' /tmp/manifest.json
          assert_contains install-primary-action 'Install PSP App' /tmp/install.html
          assert_contains install-one-app-identity 'One official PSP app identity' /tmp/install.html
          test -s /tmp/chapter-logo || { echo 'FAILED_ASSERTION=chapter-logo-nonempty' >&2; exit 1; }
          echo "chapter-logo-nonempty -> PASS"
          assert_contains login-welcome 'Welcome to PSP' /tmp/login.html
          assert_contains login-design-marker 'data-login-design="login-ux-v1"' /tmp/login.html
          assert_contains login-forgot-password 'Forgot password?' /tmp/login.html
          assert_contains login-apply-online 'Apply online' /tmp/login.html

          echo "All r8 public-asset diagnostic assertions passed."
