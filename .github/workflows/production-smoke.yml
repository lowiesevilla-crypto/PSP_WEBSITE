name: PSP Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psp-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Verify public production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: https://psp.hoahub.tech
      EXPECTED_RELEASE: 2026-09-05-r13
      EXPECTED_DEPLOYMENT_GENERATION: 2026-09-05-release-keyed-pwa-install-v1

    steps:
      - name: Wait for exact deployed main release
        shell: bash
        run: |
          set -Eeuo pipefail
          deployed=false
          network_failures=0
          last_status=""
          : > /tmp/psp-health.json

          for attempt in {1..40}; do
            status="$(curl --silent --show-error --max-time 10 \
              --output /tmp/psp-health.json \
              --write-out '%{http_code}' \
              "$PROD_URL/api/health" || true)"
            last_status="${status:-000}"
            echo "Health attempt $attempt: HTTP ${last_status}"
            if [ "$last_status" = "000" ]; then
              network_failures=$((network_failures + 1))
            fi
            if [ "$last_status" = "200" ] \
              && grep -q '"service":"psi-sigma-phi-digital-platform"' /tmp/psp-health.json \
              && grep -q "\"release\":\"$EXPECTED_RELEASE\"" /tmp/psp-health.json \
              && grep -q "\"deploymentGeneration\":\"$EXPECTED_DEPLOYMENT_GENERATION\"" /tmp/psp-health.json; then
              deployed=true
              break
            fi
            sleep 15
          done

          if [ "$deployed" != "true" ]; then
            echo "Expected PSP deployment generation did not become visible within the deployment window." >&2
            echo "Last health status: ${last_status:-unknown}; network-level failures: $network_failures/40" >&2
            if [ "$network_failures" -eq 40 ]; then
              echo "Production endpoint was unreachable from the GitHub runner for every attempt; this is a reachability/hosting gate, not an application-generation assertion failure." >&2
            fi
            echo "Resolver diagnostics:" >&2
            getent ahosts psp.hoahub.tech >&2 || true
            echo "Last health response:" >&2
            cat /tmp/psp-health.json 2>/dev/null || true
            exit 1
          fi

          cat /tmp/psp-health.json

      - name: Verify datastore and authentication readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/psp-readiness.json \
            --write-out '%{http_code}' \
            "$PROD_URL/api/health/ready")"
          echo "Readiness status: $status"
          cat /tmp/psp-readiness.json
          test "$status" = "200"
          grep -q '"status":"ready"' /tmp/psp-readiness.json
          grep -q '"database":"ok"' /tmp/psp-readiness.json
          grep -q '"authSchema":"ok"' /tmp/psp-readiness.json
          grep -q '"baseline":"ok"' /tmp/psp-readiness.json
          grep -q '"memberMobileSchema":"ok"' /tmp/psp-readiness.json
          grep -q '"authConfig":"ok"' /tmp/psp-readiness.json

      - name: Verify PSP public pages and PWA assets
        shell: bash
        run: |
          set -Eeuo pipefail

          fetch_200() {
            label="$1"
            url="$2"
            output="$3"
            follow="${4:-no}"
            if [ "$follow" = "yes" ]; then
              status="$(curl --silent --show-error --location --max-time 15 --output "$output" --write-out '%{http_code}' "$url" || true)"
            else
              status="$(curl --silent --show-error --max-time 15 --output "$output" --write-out '%{http_code}' "$url" || true)"
            fi
            echo "$label -> HTTP ${status:-000}, bytes=$(wc -c < "$output" 2>/dev/null || echo 0)"
            if [ "$status" != "200" ]; then
              echo "FAILED_FETCH=$label" >&2
              head -c 1600 "$output" 2>/dev/null >&2 || true
              echo >&2
              exit 1
            fi
          }

          assert_contains() {
            label="$1"
            pattern="$2"
            file="$3"
            if grep -q "$pattern" "$file"; then
              echo "$label -> PASS"
            else
              echo "FAILED_ASSERTION=$label pattern=$pattern" >&2
              echo "--- response excerpt ---" >&2
              head -c 3000 "$file" >&2 || true
              echo >&2
              exit 1
            fi
          }

          INSTALL_URL="$PROD_URL/install?release=$EXPECTED_DEPLOYMENT_GENERATION"

          fetch_200 home "$PROD_URL/" /tmp/psp-home.html yes
          fetch_200 manifest "$PROD_URL/manifest.webmanifest" /tmp/psp-manifest.json
          fetch_200 privacy "$PROD_URL/privacy" /tmp/psp-privacy.html
          fetch_200 register "$PROD_URL/register" /tmp/psp-register.html
          fetch_200 install "$INSTALL_URL" /tmp/psp-install.html
          fetch_200 login "$PROD_URL/login" /tmp/psp-login.html
          fetch_200 chapter-logo-fallback "$PROD_URL/api/public/chapters/prod-smoke-invalid/logo" /tmp/psp-brand-logo yes

          assert_contains home-brand 'Psi Sigma Phi' /tmp/psp-home.html
          assert_contains manifest-start-url '"start_url"' /tmp/psp-manifest.json
          assert_contains manifest-stable-id '"id":"/"' /tmp/psp-manifest.json
          assert_contains registration-mobile-checkbox 'data-registration-acknowledgement-version="mobile-checkbox-v1"' /tmp/psp-register.html
          assert_contains install-primary-action 'Install PSP App' /tmp/psp-install.html
          assert_contains install-one-app 'One PSP app' /tmp/psp-install.html
          assert_contains install-design-marker 'data-pwa-install-version="simple-cross-platform-pwa-v1"' /tmp/psp-install.html
          assert_contains install-release-marker "data-pwa-install-release=\"$EXPECTED_DEPLOYMENT_GENERATION\"" /tmp/psp-install.html
          test -s /tmp/psp-brand-logo || { echo 'FAILED_ASSERTION=chapter-logo-nonempty' >&2; exit 1; }
          echo 'chapter-logo-nonempty -> PASS'
          assert_contains login-welcome 'Welcome to PSP' /tmp/psp-login.html
          assert_contains login-design-marker 'data-login-design="login-ux-v1"' /tmp/psp-login.html
          assert_contains login-forgot-password 'Forgot password?' /tmp/psp-login.html
          assert_contains login-apply-online 'Apply online' /tmp/psp-login.html

      - name: Verify production security headers
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --head "$PROD_URL/" > /tmp/psp-headers.txt
          grep -qi '^x-content-type-options: *nosniff' /tmp/psp-headers.txt
          grep -qi '^x-frame-options:' /tmp/psp-headers.txt
          grep -qi '^referrer-policy:' /tmp/psp-headers.txt

      - name: Verify canonical login origin and JSON failures
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_email="prod-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          canonical_status="$(curl --silent --show-error \
            --output /tmp/psp-login-canonical.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Origin: $PROD_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$smoke_email\",\"password\":\"production-smoke-invalid-password\"}" \
            "$PROD_URL/api/auth/login")"
          echo "Canonical-origin invalid-login status: $canonical_status"
          cat /tmp/psp-login-canonical.json
          test "$canonical_status" = "401"
          grep -q '"message":"Invalid email or password."' /tmp/psp-login-canonical.json

          cross_site_status="$(curl --silent --show-error \
            --output /tmp/psp-login-cross-site.json \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Origin: https://malicious.example' \
            -H 'Sec-Fetch-Site: cross-site' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$PROD_URL/api/auth/login")"
          echo "Cross-site login status: $cross_site_status"
          cat /tmp/psp-login-cross-site.json
          test "$cross_site_status" = "403"

      - name: Verify member-mobile public verification routes are deployed
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "/verify/member/prod-smoke-invalid-token" "/verify/prod-smoke-invalid-token"; do
            status="$(curl --silent --show-error --location \
              --output /tmp/psp-verify.html \
              --write-out '%{http_code}' \
              "$PROD_URL$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" != "500"
          done

      - name: Production smoke summary
        run: |
          echo "PSP public production smoke passed for $PROD_URL release $EXPECTED_RELEASE generation $EXPECTED_DEPLOYMENT_GENERATION"
