name: PSP Certificate Hotfix Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psp-certificate-hotfix-production-smoke
  cancel-in-progress: true

jobs:
  verify-certificate-hotfix:
    name: Verify certificate hotfix deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: https://psp.hoahub.tech
      EXPECTED_RELEASE: 2026-09-11-r22
      EXPECTED_CERTIFICATE_HOTFIX_VERSION: chapter-logo-email-invalidation-v1

    steps:
      - name: Wait for certificate hotfix capability
        shell: bash
        run: |
          set -Eeuo pipefail
          deployed=false
          : > /tmp/psp-health.json

          for attempt in {1..40}; do
            status="$(curl --silent --show-error --max-time 10 \
              --output /tmp/psp-health.json \
              --write-out '%{http_code}' \
              "$PROD_URL/api/health" || true)"
            echo "Health attempt $attempt: HTTP ${status:-000}"
            if [ "$status" = "200" ] \
              && grep -q "\"release\":\"$EXPECTED_RELEASE\"" /tmp/psp-health.json \
              && grep -q "\"certificateHotfixVersion\":\"$EXPECTED_CERTIFICATE_HOTFIX_VERSION\"" /tmp/psp-health.json; then
              deployed=true
              break
            fi
            sleep 15
          done

          if [ "$deployed" != "true" ]; then
            echo "Expected certificate hotfix capability did not become visible within the deployment window." >&2
            cat /tmp/psp-health.json 2>/dev/null || true
            exit 1
          fi

          cat /tmp/psp-health.json

      - name: Verify production readiness remains green
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl --silent --show-error --max-time 15 \
            --output /tmp/psp-readiness.json \
            --write-out '%{http_code}' \
            "$PROD_URL/api/health/ready")"
          cat /tmp/psp-readiness.json
          test "$status" = "200"
          grep -q '"status":"ready"' /tmp/psp-readiness.json
          grep -q '"database":"ok"' /tmp/psp-readiness.json
          grep -q '"authSchema":"ok"' /tmp/psp-readiness.json
          grep -q '"customCertificateSchema":"ok"' /tmp/psp-readiness.json

      - name: Certificate hotfix production summary
        run: |
          echo "Certificate hotfix is deployed on $EXPECTED_RELEASE and PSP readiness remains green."
