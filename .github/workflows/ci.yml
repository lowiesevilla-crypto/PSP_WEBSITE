name: PSP CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: psp_platform
          MYSQL_USER: psp
          MYSQL_PASSWORD: psp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://psp:psp@127.0.0.1:3306/psp_platform
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENV: test
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
      PAYMONGO_WEBHOOK_SECRET: ci-only-paymongo-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject committed high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='.env.example' '(sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'High-risk secret-like material detected in source.' >&2
            exit 1
          fi

      - name: Verify security header configuration
        shell: bash
        run: |
          grep -q 'X-Content-Type-Options' next.config.ts
          grep -q 'Referrer-Policy' next.config.ts
          grep -q 'X-Frame-Options' next.config.ts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to CI MySQL
        run: npx prisma db push --skip-generate

      - name: Seed PSP baseline
        run: npm run seed

      - name: Validate System Admin bootstrap
        run: npm run bootstrap-admin
        env:
          BOOTSTRAP_ADMIN_EMAIL: ci-system-admin@example.invalid
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-2026
          BOOTSTRAP_ADMIN_NAME: CI System Admin
          BOOTSTRAP_ADMIN_MEMBER_NO: CI-ADMIN-0001
          BOOTSTRAP_ADMIN_CHAPTER_CODE: RHO_ALPHA_DLP
          BOOTSTRAP_ADMIN_FIRST_NAME: CI
          BOOTSTRAP_ADMIN_LAST_NAME: Administrator

      - name: Prepare cross-chapter security fixtures
        run: node scripts/ci-prepare-isolation.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production runtime and security smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run start > /tmp/psp-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            echo '--- PSP server log ---'
            cat /tmp/psp-next.log || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          HEALTH="$(curl --fail --silent http://127.0.0.1:3000/api/health)"
          echo "$HEALTH"
          printf '%s' "$HEALTH" | grep -q '"release":"2026-09-05-r10"'
          printf '%s' "$HEALTH" | grep -q '"deploymentGeneration":"2026-09-05-simple-pwa-install-v1"'

          READINESS="$(curl --fail --silent http://127.0.0.1:3000/api/health/ready)"
          echo "$READINESS"
          printf '%s' "$READINESS" | grep -q '"status":"ready"'
          printf '%s' "$READINESS" | grep -q '"database":"ok"'
          printf '%s' "$READINESS" | grep -q '"authSchema":"ok"'
          printf '%s' "$READINESS" | grep -q '"baseline":"ok"'
          printf '%s' "$READINESS" | grep -q '"memberMobileSchema":"ok"'
          printf '%s' "$READINESS" | grep -q '"authConfig":"ok"'

          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > /tmp/psp-manifest.json
          grep -q '"id":"/"' /tmp/psp-manifest.json
          curl --fail --silent http://127.0.0.1:3000/privacy > /dev/null
          curl --fail --silent http://127.0.0.1:3000/register > /dev/null
          curl --fail --silent http://127.0.0.1:3000/install > /tmp/psp-install.html
          grep -q 'Install PSP App' /tmp/psp-install.html
          grep -q 'One PSP app' /tmp/psp-install.html
          grep -q 'data-pwa-install-version="simple-cross-platform-pwa-v1"' /tmp/psp-install.html
          curl --fail --silent --location http://127.0.0.1:3000/api/public/chapters/ci-missing-chapter/logo > /tmp/psp-brand-logo
          test -s /tmp/psp-brand-logo
          curl --fail --silent http://127.0.0.1:3000/login > /tmp/psp-login.html
          grep -q 'Welcome to PSP' /tmp/psp-login.html
          grep -q 'data-login-design="login-ux-v1"' /tmp/psp-login.html
          grep -q 'Forgot password?' /tmp/psp-login.html
          grep -q 'Apply online' /tmp/psp-login.html

          CROSS_SITE_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H 'Origin: https://malicious.example' \
            -H 'Sec-Fetch-Site: cross-site' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:3000/api/auth/login)"
          echo "Cross-site login status: $CROSS_SITE_STATUS"
          test "$CROSS_SITE_STATUS" = "403"

          CANONICAL_LOGIN_STATUS="$(curl --silent --output /tmp/psp-admin-login.json --write-out '%{http_code}' \
            --cookie-jar /tmp/psp-admin.cookies \
            -X POST \
            -H 'Origin: https://psp.hoahub.tech' \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-system-admin@example.invalid","password":"ci-only-bootstrap-password-2026"}' \
            http://127.0.0.1:3000/api/auth/login)"
          echo "Canonical-origin admin login status: $CANONICAL_LOGIN_STATUS"
          cat /tmp/psp-admin-login.json
          test "$CANONICAL_LOGIN_STATUS" = "200"

          AUTH_CONTEXT="$(curl --fail --silent \
            --cookie /tmp/psp-admin.cookies \
            http://127.0.0.1:3000/api/auth/me)"
          echo "Admin auth context: $AUTH_CONTEXT"
          printf '%s' "$AUTH_CONTEXT" | grep -q '"authenticated":true'
          printf '%s' "$AUTH_CONTEXT" | grep -q '"membershipNo":"CI-ADMIN-0001"'
          printf '%s' "$AUTH_CONTEXT" | grep -q '"chapterId":null'
          printf '%s' "$AUTH_CONTEXT" | grep -q '"chapters.manage"'

          LOGIN_REDIRECT="$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            --cookie /tmp/psp-admin.cookies \
            http://127.0.0.1:3000/login)"
          echo "Authenticated /login redirect: $LOGIN_REDIRECT"
          printf '%s' "$LOGIN_REDIRECT" | grep -Eq '^30[2378] https?://[^ ]+/admin$'

          INVALID_WEBHOOK_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:3000/api/webhooks/paymongo)"
          echo "Invalid webhook status: $INVALID_WEBHOOK_STATUS"
          test "$INVALID_WEBHOOK_STATUS" = "401"

          node scripts/ci-isolation-test.mjs

      - name: Remove development-only packages
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Produce production dependency audit
        shell: bash
        run: |
          set -Eeuo pipefail
          valid=false
          for attempt in 1 2 3 4 5; do
            rm -f runtime-audit.json
            set +e
            timeout --signal=TERM --kill-after=5s 45s \
              npm audit --omit=dev --json --fetch-timeout=30000 --fetch-retries=0 > runtime-audit.json
            audit_status=$?
            set -e

            echo "npm audit attempt $attempt exit status: $audit_status"
            if [ "$audit_status" -eq 124 ] || [ "$audit_status" -eq 137 ]; then
              echo "npm audit timed out before producing trusted vulnerability evidence." >&2
            elif node scripts/check-runtime-audit.mjs --validate-only; then
              valid=true
              break
            else
              echo "npm audit did not return valid vulnerability evidence on attempt $attempt." >&2
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$valid" != "true" ]; then
            echo "Runtime dependency audit evidence could not be obtained after bounded retries; failing closed." >&2
            exit 1
          fi

      - name: Enforce runtime dependency audit
        run: node scripts/check-runtime-audit.mjs
